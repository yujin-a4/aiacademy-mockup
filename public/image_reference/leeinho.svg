<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="skin4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAD7B5"/>
      <stop offset="100%" stop-color="#F0B990"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg4)"/>

  <!-- Dress shirt (light blue) + jacket hint -->
  <path d="M 20 500 L 55 428 Q 108 397 200 386 Q 292 397 345 428 L 380 500 Z" fill="#1D4ED8"/>
  <!-- Shirt (lighter blue) -->
  <path d="M 178 330 L 178 390 L 222 390 L 222 330" fill="#DBEAFE"/>
  <!-- Tie (navy) -->
  <path d="M 196 330 L 190 375 L 200 390 L 210 375 L 204 330 Z" fill="#1E3A8A"/>
  <path d="M 196 330 L 204 330 L 205 342 L 200 346 L 195 342 Z" fill="#1E3A8A"/>

  <!-- Neck -->
  <rect x="183" y="288" width="34" height="55" rx="12" fill="url(#skin4)"/>

  <!-- Head -->
  <ellipse cx="200" cy="228" rx="83" ry="90" fill="url(#skin4)"/>

  <!-- Hair (dark, neatly side-parted) -->
  <path d="M 117 210 C 118 153 158 128 200 126 C 242 128 282 153 283 210 C 266 160 238 143 200 141 C 162 143 134 160 117 210 Z" fill="#111118"/>
  <ellipse cx="200" cy="152" rx="83" ry="36" fill="#111118"/>
  <!-- Side part line -->
  <path d="M 185 130 L 180 165" stroke="#2A2A35" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Neat side swept -->
  <path d="M 185 130 C 178 145 175 162 176 175" stroke="#111118" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Short side hair -->
  <path d="M 117 198 C 115 212 116 228 118 244" stroke="#111118" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 283 198 C 285 212 284 228 282 244" stroke="#111118" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="117" cy="230" rx="10" ry="13" fill="#EAA882"/>
  <ellipse cx="283" cy="230" rx="10" ry="13" fill="#EAA882"/>

  <!-- Eyes (focused, analytical) -->
  <ellipse cx="171" cy="228" rx="12" ry="12" fill="#111118"/>
  <ellipse cx="229" cy="228" rx="12" ry="12" fill="#111118"/>
  <!-- Eye shine -->
  <circle cx="174" cy="224" r="3.5" fill="white"/>
  <circle cx="232" cy="224" r="3.5" fill="white"/>
  <circle cx="175" cy="225" r="1.3" fill="#111118"/>
  <circle cx="233" cy="225" r="1.3" fill="#111118"/>

  <!-- Eyebrows (straight, decisive) -->
  <path d="M 157 210 L 185 208" stroke="#111118" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 215 208 L 243 210" stroke="#111118" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 195 250 Q 200 260 205 250" stroke="#C88A60" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="194" cy="258" r="2.5" fill="#C88A60" opacity="0.35"/>
  <circle cx="206" cy="258" r="2.5" fill="#C88A60" opacity="0.35"/>

  <!-- Confident slight smile -->
  <path d="M 183 271 Q 200 284 217 271" stroke="#C06040" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 183 271 Q 191 277 200 276 Q 209 277 217 271" fill="#E8967A" opacity="0.45"/>
</svg>
