<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🎙️ 음성인식 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0f1a;--surface:#1a1a2e;--s2:#16213e;--accent:#7c3aed;--a2:#a78bfa;--glow:rgba(124,58,237,.4);--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--tx:#f1f5f9;--muted:#94a3b8;--bd:rgba(148,163,184,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px;
  background-image:radial-gradient(ellipse at 20% 20%,rgba(124,58,237,.15) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(167,139,250,.1) 0%,transparent 50%)}
.back{color:var(--muted);text-decoration:none;font-size:.9rem;margin-bottom:28px;display:inline-block}
.back:hover{color:var(--a2)}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:var(--muted);margin-top:6px}
.badge{display:inline-block;background:rgba(124,58,237,.2);border:1px solid rgba(124,58,237,.4);color:var(--a2);font-size:.75rem;padding:4px 12px;border-radius:20px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:20px;padding:28px;width:100%;max-width:720px;margin-bottom:20px}
.card-title{font-size:1rem;font-weight:600;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.lang-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lang-btn{padding:14px 8px;border-radius:12px;border:2px solid var(--bd);background:var(--s2);color:var(--tx);font-family:'Outfit',sans-serif;font-size:.85rem;cursor:pointer;transition:.2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.lang-btn:hover{border-color:var(--a2);background:rgba(124,58,237,.1)}
.lang-btn.active{border-color:var(--accent);background:rgba(124,58,237,.2);box-shadow:0 0 20px var(--glow)}
.lang-btn .flag{font-size:1.5rem}
.lang-btn .nm{font-size:.7rem;color:var(--muted)}
.mic-section{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0}
.mic-btn{width:110px;height:110px;border-radius:50%;border:3px solid var(--accent);background:rgba(124,58,237,.1);cursor:pointer;font-size:2.8rem;transition:.3s;box-shadow:0 0 30px var(--glow)}
.mic-btn:hover{background:rgba(124,58,237,.25);transform:scale(1.05)}
.mic-btn.rec{border-color:var(--err);background:rgba(239,68,68,.15);box-shadow:0 0 40px rgba(239,68,68,.5);animation:pmx 1.2s ease-in-out infinite}
@keyframes pmx{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.waveform{display:flex;align-items:center;gap:4px;height:44px;opacity:0;transition:.3s}
.waveform.active{opacity:1}
.wb{width:4px;background:linear-gradient(to top,var(--accent),var(--a2));border-radius:2px;animation:wv .8s ease-in-out infinite}
.wb:nth-child(1){animation-delay:0s}.wb:nth-child(2){animation-delay:.1s}.wb:nth-child(3){animation-delay:.2s}
.wb:nth-child(4){animation-delay:.3s}.wb:nth-child(5){animation-delay:.4s}.wb:nth-child(6){animation-delay:.3s}
.wb:nth-child(7){animation-delay:.2s}.wb:nth-child(8){animation-delay:.1s}.wb:nth-child(9){animation-delay:0s}
@keyframes wv{0%,100%{height:8px}50%{height:36px}}
.status{font-size:.95rem;color:var(--muted);font-weight:500}
.status.rec{color:var(--err)}.status.ok{color:var(--ok)}
.result-box{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:20px;min-height:100px;font-size:1.15rem;line-height:1.7}
.result-box .ph{color:rgba(148,163,184,.4);font-style:italic;font-size:.95rem}
.result-box .interim{color:var(--muted);font-style:italic}
.conf-label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.conf-bg{background:var(--s2);border-radius:8px;height:9px;overflow:hidden}
.conf-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--a2));width:0%;transition:width .6s ease}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-p{background:linear-gradient(135deg,var(--accent),#6d28d9);color:#fff;box-shadow:0 4px 20px var(--glow)}
.btn-p:hover{transform:translateY(-2px)}
.btn-g{background:var(--s2);color:var(--muted);border:1px solid var(--bd)}
.btn-g:hover{color:var(--tx)}
.notice{display:flex;align-items:center;gap:8px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:12px 16px;font-size:.82rem;color:var(--warn)}
.log-wrap{max-height:200px;overflow-y:auto}
.log-wrap::-webkit-scrollbar{width:4px}
.log-wrap::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
.log-item{background:var(--s2);border-radius:10px;padding:10px 14px;border-left:3px solid var(--accent);font-size:.88rem;margin-bottom:8px}
.log-item .lt{color:var(--muted);font-size:.72rem;margin-bottom:3px}
.log-item .ll{color:var(--a2);font-size:.72rem;margin-top:3px}
.log-empty{text-align:center;color:rgba(148,163,184,.35);font-size:.88rem;padding:16px}
</style>
</head>
<body>
<a href="index.html" class="back">← 대시보드로</a>
<div class="header">
  <div class="badge">Web Speech API · Test</div>
  <h1>🎙️ 음성인식 테스트</h1>
  <p>실시간 음성 → 텍스트 변환 (브라우저 내장 API)</p>
</div>

<div class="card">
  <div class="card-title">🌐 인식 언어</div>
  <div class="lang-grid">
    <button class="lang-btn active" data-lang="ko-KR" onclick="setLang(this)"><span class="flag">🇰🇷</span>한국어<span class="nm">Korean</span></button>
    <button class="lang-btn" data-lang="en-US" onclick="setLang(this)"><span class="flag">🇺🇸</span>영어<span class="nm">English</span></button>
    <button class="lang-btn" data-lang="ja-JP" onclick="setLang(this)"><span class="flag">🇯🇵</span>일본어<span class="nm">Japanese</span></button>
    <button class="lang-btn" data-lang="zh-CN" onclick="setLang(this)"><span class="flag">🇨🇳</span>중국어<span class="nm">Chinese</span></button>
  </div>
</div>

<div class="card">
  <div class="card-title">🎤 녹음 컨트롤</div>
  <div class="mic-section">
    <div class="waveform" id="wave">
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
      <div class="wb"></div><div class="wb"></div><div class="wb"></div>
    </div>
    <button class="mic-btn" id="micBtn" onclick="toggle()">🎙️</button>
    <p class="status" id="statusTxt">마이크 버튼을 눌러 녹음 시작</p>
  </div>
</div>

<div class="card">
  <div class="card-title">📝 인식 결과</div>
  <div class="result-box" id="result"><span class="ph">음성을 인식하면 여기에 텍스트가 표시됩니다...</span></div>
  <div style="margin-top:16px">
    <div class="conf-label"><span>인식 신뢰도 (Confidence)</span><span id="confVal">–</span></div>
    <div class="conf-bg"><div class="conf-fill" id="confBar"></div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-g" onclick="clearResult()">🗑 지우기</button>
    <button class="btn btn-p" onclick="copyResult()">📋 복사</button>
  </div>
</div>

<div class="card" style="padding:16px">
  <div class="notice" id="notice">⚠️ Chrome / Edge 브라우저에서 최적 동작합니다.</div>
</div>

<div class="card">
  <div class="card-title">📋 인식 기록</div>
  <div class="log-wrap" id="logWrap"><div class="log-empty">아직 인식 기록이 없습니다.</div></div>
  <button class="btn btn-g" onclick="clearLog()" style="width:100%;margin-top:12px">기록 초기화</button>
</div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  const n = document.getElementById('notice');
  n.textContent = '❌ 이 브라우저는 Web Speech API를 지원하지 않습니다. Chrome/Edge를 사용해주세요.';
  n.style.cssText = 'background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#ef4444;display:flex;align-items:center;gap:8px;border-radius:10px;padding:12px 16px;font-size:.82rem';
}

let rec = null, running = false, lang = 'ko-KR', finalTx = '';

function setLang(el) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active'); lang = el.dataset.lang;
}

function toggle() { running ? stop() : start(); }

function start() {
  if (!SR) return;
  finalTx = '';
  rec = new SR();
  rec.lang = lang; rec.continuous = true; rec.interimResults = true;
  rec.onstart = () => {
    running = true;
    document.getElementById('micBtn').classList.add('rec');
    document.getElementById('micBtn').textContent = '⏹️';
    document.getElementById('statusTxt').className = 'status rec';
    document.getElementById('statusTxt').textContent = '녹음 중... 말씀해주세요';
    document.getElementById('wave').classList.add('active');
    document.getElementById('result').innerHTML = '<span class="interim">인식 대기 중...</span>';
  };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) { finalTx += t + ' '; setConf(e.results[i][0].confidence); }
      else interim += t;
    }
    document.getElementById('result').innerHTML = `<span>${finalTx}</span><span class="interim">${interim}</span>`;
  };
  rec.onerror = e => {
    const m = {
      'not-allowed': '마이크 권한이 거부되었습니다.',
      'no-speech': '음성이 감지되지 않았습니다.',
      'network': '네트워크 오류가 발생했습니다.'
    };
    document.getElementById('statusTxt').textContent = m[e.error] || `오류: ${e.error}`;
    document.getElementById('statusTxt').className = 'status';
    stop();
  };
  rec.onend = () => {
    if (finalTx.trim()) { addLog(finalTx.trim()); setStatus('ok', '인식 완료!'); }
    if (running) rec.start();
    else resetUI();
  };
  rec.start();
}

function stop() {
  running = false;
  if (rec) { rec.stop(); rec = null; }
  resetUI();
}

function resetUI() {
  document.getElementById('micBtn').classList.remove('rec');
  document.getElementById('micBtn').textContent = '🎙️';
  document.getElementById('wave').classList.remove('active');
  setStatus('', '마이크 버튼을 눌러 녹음 시작');
}

function setStatus(cls, txt) {
  const el = document.getElementById('statusTxt');
  el.className = 'status' + (cls ? ' ' + cls : '');
  el.textContent = txt;
}

function setConf(c) {
  if (c == null) return;
  const pct = Math.round(c * 100);
  document.getElementById('confVal').textContent = pct + '%';
  const bar = document.getElementById('confBar');
  bar.style.width = pct + '%';
  bar.style.background = `linear-gradient(90deg,${pct>=80?'#10b981':pct>=60?'#f59e0b':'#ef4444'},#7c3aed)`;
}

function clearResult() {
  finalTx = '';
  document.getElementById('result').innerHTML = '<span class="ph">음성을 인식하면 여기에 텍스트가 표시됩니다...</span>';
  document.getElementById('confVal').textContent = '–';
  document.getElementById('confBar').style.width = '0%';
}

function copyResult() {
  const t = document.getElementById('result').innerText;
  navigator.clipboard.writeText(t).then(() => {
    const btn = event.target; btn.textContent = '✅ 복사됨!';
    setTimeout(() => btn.textContent = '📋 복사', 1500);
  });
}

function addLog(text) {
  const w = document.getElementById('logWrap');
  const emp = w.querySelector('.log-empty');
  if (emp) emp.remove();
  const langMap = {'ko-KR':'🇰🇷 한국어','en-US':'🇺🇸 영어','ja-JP':'🇯🇵 일본어','zh-CN':'🇨🇳 중국어'};
  const d = document.createElement('div');
  d.className = 'log-item';
  d.innerHTML = `<div class="lt">🕐 ${new Date().toLocaleTimeString('ko-KR')}</div><div>${text}</div><div class="ll">${langMap[lang]||lang}</div>`;
  w.insertBefore(d, w.firstChild);
}

function clearLog() {
  document.getElementById('logWrap').innerHTML = '<div class="log-empty">아직 인식 기록이 없습니다.</div>';
}
</script>
</body>
</html>
